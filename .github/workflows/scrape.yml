name: scrape-combos

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小時（UTC）
  workflow_dispatch: {}      # 可在 Actions 頁面手動執行

permissions:
  contents: write            # 讓 workflow 能把 combos.json commit 回 repo

concurrency:
  group: scrape-combos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Install CJK font (for T-table image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Run scraper
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scraper/scraper.py

      - name: Update 雙北賽事 (beybladehub.app/events)
        run: python scraper/build_events.py

      - name: Update 高手 T 表 data
        run: python scraper/build_tier.py

      - name: Cache T-table part images
        uses: actions/cache@v4
        with:
          path: .cache/tier-img
          key: tier-img-v1-${{ github.run_id }}
          restore-keys: tier-img-v1-

      - name: Render T-table image
        run: python scraper/make_tier_image.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/combos.json data/events.json data/tier_pro.json data/tier.jpg data/tier.hash)" ]; then
            git config user.name  "combo-bot"
            git config user.email "combo-bot@users.noreply.github.com"
            git add data/combos.json data/events.json data/tier_pro.json data/tier.jpg data/tier.hash
            git commit -m "chore(data): update combos/events $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "data 沒有變更"
          fi
